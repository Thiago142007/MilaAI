<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOVA - Autonomous Multimodal AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="boot-overlay">
    <div class="boot-box">
      <div class="boot-logo">NOVA</div>
      <div class="boot-tagline">AUTONOMOUS MULTIMODAL AGENT</div>
      <div class="boot-status"><span class="dot amber"></span> Initializing...</div>
      <ul id="boot-checks"></ul>
    </div>
  </div>

  <header id="topbar">
    <div class="brand">NOVA <span class="brand-sub">AI</span></div>
    <div id="global-status" class="status-pill offline"><span class="dot"></span> OFFLINE</div>
    <div class="spacer"></div>
    <div class="voice-toggle-wrap" title="Auto-fala para respostas">
      <label class="toggle-label">
        <input type="checkbox" id="tts-toggle" checked />
        <span class="toggle-icon">🔊 Voz</span>
      </label>
    </div>
    <select id="mode-select" title="Modo de autonomia">
      <option value="manual">MANUAL</option>
      <option value="assisted">ASSISTED</option>
      <option value="autonomous">AUTONOMOUS</option>
    </select>
  </header>

  <nav id="sidebar">
    <button data-page="chat" class="active"><span class="icon">💬</span> Chat</button>
    <button data-page="tasks"><span class="icon">📋</span> Tasks</button>
    <button data-page="screen"><span class="icon">🖥️</span> Screen</button>
    <button data-page="memory"><span class="icon">🧠</span> Memory</button>
    <button data-page="tools"><span class="icon">⚡</span> Tools</button>
    <button data-page="devices"><span class="icon">📡</span> Devices</button>
    <button data-page="permissions"><span class="icon">🛡️</span> Permissions</button>
    <button data-page="logs"><span class="icon">📜</span> Logs</button>
    <button data-page="settings"><span class="icon">⚙️</span> Settings</button>
  </nav>

  <main id="view"></main>

  <footer id="taskbar">
    <div id="current-task">
      <span id="task-label">Sem tarefa ativa</span>
      <progress id="task-progress" max="100" value="0"></progress>
      <span id="task-percent">0%</span>
    </div>
    <button id="voice-cancel-btn" title="Interromper fala atual" style="display:none;" class="btn-voice-stop">⏹️ Silenciar</button>
    <button id="stop-btn" title="Parar tudo agora (Ctrl+Alt+Shift+X)">STOP NOVA</button>
    <button id="reset-btn" hidden>Reset emergência</button>
  </footer>

  <div id="confirm-root"></div>
  <div id="toast-root"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
